# init-project-file v1 — managed by /init-project; re-sync replaces this file (Dependabot's action-pin bumps are kept as the same version)
# Security checks on pull requests into develop, every Monday, and on demand: committed secrets (gitleaks),
# dependencies with known vulnerabilities (OSV-Scanner), insecure workflows (zizmor), and Docker and
# infrastructure misconfigurations (Trivy, only when the repo has a Dockerfile or compose file).
# Actions are pinned to full commit SHAs, which Dependabot bumps. The scanner downloads are pinned by version
# and sha256, and change with a new version of this file.
name: Security

on:
  pull_request:
    branches: [develop]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the commits (a pull request's own; the whole history on schedule)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$BASE_SHA..HEAD" .
          else
            "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
          fi

  dependencies:
    name: Vulnerable dependencies (OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OSV-Scanner 2.7.0
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - name: Scan lockfiles and manifests
        run: |
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source --recursive .
          code=$?
          if [ "$code" -eq 128 ]; then
            echo "No lockfiles or manifests found: nothing to scan."
            exit 0
          fi
          exit "$code"

  workflows:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: "1.31.1"
          advanced-security: false

  containers:
    name: Docker and infrastructure config (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for a Dockerfile or compose file
        id: find
        run: |
          if git ls-files | grep -qiE '(^|/)((docker|container)file[^/]*|[^/]*\.dockerfile|(docker-)?compose[^/]*\.ya?ml)$'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Dockerfile or compose file: nothing to scan."
          fi
      - name: Install Trivy 0.76.1
        if: steps.find.outputs.found == 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
      - name: Scan the config (high and critical findings fail the job)
        if: steps.find.outputs.found == 'true'
        run: '"$RUNNER_TEMP/trivy" config --exit-code 1 --severity HIGH,CRITICAL .'
